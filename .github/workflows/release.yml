# -*- coding: utf-8 -*-
name: Build exe and Release

on:
  push:
    branches: [master, main]
    tags: ["v*.*.*", "v*.*", "v*"]
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # PRがclosedでマージされてない場合（単にクローズ）はスキップ
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: windows-latest
    steps:
      - name: Checkout (PR merged -> base branch)
        if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Checkout (push / PR open)
        if: github.event_name != 'pull_request' || github.event.pull_request.merged != true
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
          pip list

      - name: Run tests (non-blocking)
        run: |
          pip install pytest
          pytest -q || echo "::warning::tests failed - continuing build"
        shell: bash

      - name: Build exe with PyInstaller
        run: |
          pyinstaller --clean --noconfirm app.spec
          ls -lh dist/
          dir dist
        shell: bash

      - name: Rename artifact for release
        run: |
          cd dist
          ls -lh
          # app.spec は name='app' なので app.exe が出来る -> OpenLAPexe.exe にリネーム
          if [ -f "app.exe" ]; then
            cp app.exe OpenLAPexe.exe
            echo "renamed app.exe -> OpenLAPexe.exe"
          fi
          if [ -f "app" ]; then
            cp app OpenLAPexe
            echo "renamed app -> OpenLAPexe"
          fi
          ls -lh
        shell: bash

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: OpenLAPexe-windows-${{ github.sha }}
          path: dist/*
          retention-days: 14

      # タグ push (v*.*.*) 時のみ Releases に公開（従来の手動バージョン指定）
      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # PRがmaster/mainにマージされたら自動リリース（要件のメイン）
  auto-release:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && (github.event.pull_request.base.ref == 'master' || github.event.pull_request.base.ref == 'main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Download artifact from build
        uses: actions/download-artifact@v4
        with:
          name: OpenLAPexe-windows-${{ github.sha }}
          path: dist

      - name: List dist
        run: ls -lhR dist

      - name: Generate tag and create Release
        uses: softprops/action-gh-release@v2
        with:
          # PRマージごとに自動で v0.1.<run_number> 的なタグを切る
          # 既存タグと衝突しないよう run_number を使用。日付ベースにしたい場合は YYYY.MM.DD に変更可
          tag_name: v0.1.${{ github.run_number }}
          name: Release v0.1.${{ github.run_number }} (PR #${{ github.event.pull_request.number }} merge)
          body: |
            Auto release triggered by PR #${{ github.event.pull_request.number }} merged into `${{ github.event.pull_request.base.ref }}`

            - PR: ${{ github.event.pull_request.title }} (#${{ github.event.pull_request.number }})
            - Author: ${{ github.event.pull_request.user.login }}
            - Merge commit: ${{ github.sha }}
            - Workflow: ${{ github.run_id }}

            exeは `OpenLAPexe.exe` をDLしてダブルクリックで起動できます。
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
