# -*- coding: utf-8 -*-
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openlapexe"
version = "0.1.0"
description = "OpenLAP Lap Time Simulator (Tk)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openlapexe = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[project.scripts]
# compat: app shim re-exports main.main (src/openlapexe/cli.py not present)
openlapexe = "app:main"
